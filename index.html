<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash To-Do App</title>
    <!-- Bootstrap CSS for nice styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="text-center mb-4">My To-Do List</h2>

        <!-- 1. LOGIN SECTION -->
        <div class="card p-3 mb-4 shadow-sm">
            <h5 class="mb-3">Login</h5>
            <div class="mb-2">
                <input type="text" id="usernameInput" class="form-control" placeholder="Username (admin)" value="admin">
            </div>
            <div class="mb-2">
                <input type="password" id="passwordInput" class="form-control" placeholder="Password (1234)" value="1234">
            </div>
            <button class="btn btn-primary w-100" onclick="loginUser(document.getElementById('usernameInput').value, document.getElementById('passwordInput').value)">Login & Get Token</button>
        </div>

        <!-- Status Alert Box for messages -->
        <div id="statusAlert" class="alert d-none" role="alert"></div>

        <!-- 2. ADD TASK SECTION -->
        <div class="input-group mb-3">
            <input type="text" id="taskInput" class="form-control" placeholder="Add a new task...">
            <button class="btn btn-success" onclick="addTask()">Add Task</button>
        </div>

        <!-- 3. TASK LIST -->
        <ul id="taskList" class="list-group"></ul>
    </div>

    <!-- Link to your JavaScript file -->
    <script src="app.js"></script>
</body>
</html>
